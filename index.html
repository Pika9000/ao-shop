<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Áo</title>
   
</head>
<body>
    <!-- 1. Header: thanh tiêu đề và giỏ hàng -->
    <header>
        <div class="logo">
            <h1>Shop Áo</h1>
        </div>
        <nav>    <!--thẻ điều hướng-->
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Sản Phẩm</a></li>
                <li><a href="#">Liên Hệ</a></li>
            </ul>
            <ul>
                <li><a href=login.html>Đăng nhập</a></li>
                <li><a href=register.html>Đăng ký</a></li>
            </ul>
        </nav>
        <div class="cart-icon">
            <span>Giỏ hàng: <strong id="cart-count">0</strong> sản phẩm</span>
        </div>
    </header>
    <!-- 2. main: khu vực hiển thị danh sách sản phẩm -->
    <main>
        <h2>Sản Phẩm Mới Nhất</h2>
        <!-- Khung chứa các thẻ sản phẩm -->
        
        <div class="product-list">

            <!-- Thẻ Sản Phẩm Số 1 -->
             <div class="product-card" data-id="1">
                <img src="" alt="Áo Kaki">
                <h3>Áo Kaki</h3>
                <p class="price">25.000VND</p>
                <button class="btn-add-cart">Thêm vào giỏ</button>
             </div>

             <!-- Thẻ Sản Phẩm số 2 -->
              <div class="product-card" data-id="2">
                <img src="" alt="Áo Phông">
                <h3>Áo Phông</h3>
                <p class="price">23.000 VND</p>
                <button class="btn-add-cart">Thêm vào giỏ</button>
              </div>

              <!-- Thẻ Sản Phẩm Số  3 -->
              <div class="product-card" data-id="3">
                <img src="" alt="Áo Lót">
                <h3>Áo Lót</h3>
                <p class="price">20.000 VND</p>
                <button class="btn-add-cart">Thêm vào giỏ</button>
              </div>

        </div>
    </main>
    <footer>
        <p>&copy; 2026 Strore. Tất cả quyền được bảo lưu.</p>
    </footer>
</body>
</html>
